apiVersion: apps/v1
kind: Deployment
metadata:
  name: homework-deployment
  namespace: homework
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: homework-app
  template:
    metadata:
      labels:
        app: homework-app
    spec:
      volumes:
      - name: homework-volume
        emptyDir: {}
      initContainers:
      - name: init-homework
        image: busybox
        command: ['sh', '-c', 'echo "Hello from homework" > /homework/index.html']
        volumeMounts:
        - name: homework-volume
          mountPath: /homework
      containers:
      - name: homework-container
        image: nginx
        volumeMounts:
        - name: homework-volume
          mountPath: /homework
        readinessProbe:
          exec:
            command:
            - cat
            - /homework/index.html
          initialDelaySeconds: 5
          periodSeconds: 10
