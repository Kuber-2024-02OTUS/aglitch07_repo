apiVersion: v1
kind: Pod
metadata:
  name: nginx-dsurov
spec:
  containers:
  - name: nginx-web
    image: test/nginx-custom:v0.2
    ports:
    - containerPort: 8000
    volumeMounts:
    - name: mydir
      mountPath: /homework
    volumeMounts:
    - name: mydir
      mountPath: /init
  volumes:
  - name: mydir
    emptyDir: {}
